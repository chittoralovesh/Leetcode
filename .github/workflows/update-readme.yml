name: Update README with LeetCode Stats

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Generate README stats
        run: python scripts/generate_readme.py

      # LeetHub pushes several commits per submission, so several runs of this
      # workflow race to push. If main moved underneath us, regenerate on top of
      # the latest main and try again instead of failing.
      - name: Commit and push changes
        run: |
          git config user.email "281591568+chittoralovesh@users.noreply.github.com"
          git config user.name "Lovesh Chittora"
          for attempt in 1 2 3 4 5; do
            git add README.md topics_cache.json
            # Skip commits where only the timestamp lines changed.
            if git diff --cached --quiet -I 'Last updated|Generated on'; then
              echo "No meaningful changes to commit."
              exit 0
            fi
            git commit -m "Auto-update README with LeetCode stats [skip ci]"
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebuilding on latest main..."
            sleep $((attempt * 5))
            git fetch origin main
            git reset --hard origin/main
            python scripts/generate_readme.py
          done
          echo "Could not push after 5 attempts."
          exit 1
